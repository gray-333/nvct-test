<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVCT 非暴力沟通人格测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 页面容器 */
        .page-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* 页面通用样式 */
        .page {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .page.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 卡片样式 */
        .info-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.6;
        }
        
        /* 表单组 */
        .form-group {
            margin-bottom: 35px;
        }
        
        .form-label {
            display: block;
            color: #444;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        /* 选项网格 */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        
        /* 选项按钮 */
        .option-btn {
            padding: 14px 10px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            color: #495057;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .option-btn:hover {
            border-color: #4f46e5;
            transform: translateY(-2px);
        }
        
        .option-btn.selected {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }
        
        /* 按钮组 */
        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            gap: 20px;
        }
        
        .btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border: 2px solid #e9ecef;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: #e9ecef;
        }
        
        .btn-primary {
            background: #4f46e5;
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3);
        }
        
        /* 欢迎页特殊样式 */
        #welcomePage .info-card {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .welcome-title {
            font-size: 32px;
            color: #4f46e5;
            margin-bottom: 20px;
        }
        
        .welcome-text {
            color: #666;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        
        .start-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .start-btn:hover {
            background: #4338ca;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .info-card {
                padding: 25px;
                margin: 10px;
            }
            
            h2 {
                font-size: 24px;
            }
            
            .options-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .info-card {
                padding: 20px;
            }
            
            .options-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- 欢迎页 -->
        <div id="welcomePage" class="page active">
            <div class="info-card">
                <h1 class="welcome-title">NVCT</h1>
                <h2>非暴力沟通人格测试</h2>
                
                <div class="welcome-text">
                    <p>亲爱的探索者：</p >
                    <p>欢迎来到你内心的沟通花园。</p >
                    <p>在这片由观察、感受、需要和请求构成的土壤中，</p >
                    <p>你独特的沟通风格正在悄然绽放。</p >
                    <p>这份报告不是标签，而是地图——</p >
                    <p>一张帮助你理解自己、连接他人、</p >
                    <p>在关系世界中更自由行走的心灵地图。</p >
                    <p>请带着温柔的好奇心，</p >
                    <p>开始这段自我发现的旅程吧。</p >
                </div>
                
                <button id="startTest" class="start-btn">开始测试</button>
            </div>
        </div>
        
        <!-- 第一页：年龄和性别 -->
        <div id="page1" class="page">
            <div class="info-card">
                <h2>让我们先了解您</h2>
                <p class="subtitle">这些信息仅用于个性化分析，我们将严格保护您的隐私</p >
                
                <div class="form-group">
                    <label class="form-label">年龄区间</label>
                    <div class="options-grid">
                        <button type="button" class="option-btn" data-value="18岁以下">18岁以下</button>
                        <button type="button" class="option-btn" data-value="18-25">18-25岁</button>
                        <button type="button" class="option-btn" data-value="26-35">26-35岁</button>
                        <button type="button" class="option-btn" data-value="36-45">36-45岁</button>
                        <button type="button" class="option-btn" data-value="46-55">46-55岁</button>
                        <button type="button" class="option-btn" data-value="56岁以上">56岁以上</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">性别</label>
                    <div class="options-grid">
                        <button type="button" class="option-btn" data-value="男">男</button>
                        <button type="button" class="option-btn" data-value="女">女</button>
                        <button type="button" class="option-btn" data-value="其他">其他</button>
                        <button type="button" class="option-btn" data-value="不愿透露">不愿透露</button>
                    </div>
                </div>
                
                <div class="button-group">
                    <button id="backToWelcome" class="btn btn-secondary">上一题</button>
                    <button id="nextToPage2" class="btn btn-primary" disabled>下一步</button>
                </div>
            </div>
        </div>
        
        <!-- 第二页：职业 -->
        <div id="page2" class="page">
            <div class="info-card">
                <h2>请选择您的职业</h2>
                <p class="subtitle">这些信息仅用于个性化分析，我们将严格保护您的隐私</p >
                
                <div class="form-group">
                    <label class="form-label">职业</label>
                    <div class="options-grid">
                        <button type="button" class="option-btn" data-value="学生">学生</button>
                        <button type="button" class="option-btn" data-value="教育">教育</button>
                        <button type="button" class="option-btn" data-value="IT/科技">IT/科技</button>
                        <button type="button" class="option-btn" data-value="医疗">医疗</button>
                        <button type="button" class="option-btn" data-value="金融">金融</button>
                        <button type="button" class="option-btn" data-value="销售/市场">销售/市场</button>
                        <button type="button" class="option-btn" data-value="自由职业">自由职业</button>
                        <button type="button" class="option-btn" data-value="其他">其他</button>
                    </div>
                </div>
                
                <div class="button-group">
                    <button id="backToPage1" class="btn btn-secondary">上一题</button>
                    <button id="startQuestions" class="btn btn-primary" disabled>开始测试</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 用户数据存储
        const userData = {
            age: '',
            gender: '',
            job: ''
        };

        // 页面跳转函数
        function goToPage(pageId) {
            // 隐藏所有页面
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            
            // 显示目标页面
            const targetPage = document.getElementById(pageId);
            if (targetPage) {
                targetPage.classList.add('active');
                window.scrollTo(0, 0);
            }
        }

        // 初始化选项按钮
        function setupOptionButtons() {
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const questionGroup = this.closest('.form-group');
                    const groupBtns = questionGroup.querySelectorAll('.option-btn');
                    
                    // 移除同组其他按钮的选中状态
                    groupBtns.forEach(b => b.classList.remove('selected'));
                    
                    // 选中当前按钮
                    this.classList.add('selected');
                    
                    // 检查当前页面是否完成选择
                    checkPageCompletion();
                });
            });
        }

        // 检查当前页面完成情况
        function checkPageCompletion() {
            const currentPage = document.querySelector('.page.active');
            
            if (currentPage.id === 'page1') {
                // 检查第一页（年龄和性别）
                const ageSelected = document.querySelector('#page1 .form-group:nth-child(1) .option-btn.selected');
                const genderSelected = document.querySelector('#page1 .form-group:nth-child(2) .option-btn.selected');
                const nextBtn = document.getElementById('nextToPage2');
                
                if (ageSelected && genderSelected) {
                    nextBtn.disabled = false;
                    
                    // 保存数据
                    userData.age = ageSelected.dataset.value;
                    userData.gender = genderSelected.dataset.value;
                } else {
                    nextBtn.disabled = true;
                }
            }
            else if (currentPage.id === 'page2') {
                // 检查第二页（职业）
                const jobSelected = document.querySelector('#page2 .option-btn.selected');
                const startBtn = document.getElementById('startQuestions');
                
                if (jobSelected) {
                    startBtn.disabled = false;
                    userData.job = jobSelected.dataset.value;
                } else {
                    startBtn.disabled = true;
                }
            }
        }

        // 页面跳转事件绑定
        document.addEventListener('DOMContentLoaded', function() {
            setupOptionButtons();
            
            // 欢迎页 -> 第一页
            document.getElementById('startTest').addEventListener('click', function() {
                goToPage('page1');
            });
            
            // 第一页 -> 第二页
            document.getElementById('nextToPage2').addEventListener('click', function() {
                goToPage('page2');
            });
            
            // 第二页 -> 第一页
            document.getElementById('backToPage1').addEventListener('click', function() {
                goToPage('page1');
            });
            
            // 第一页 -> 欢迎页
            document.getElementById('backToWelcome').addEventListener('click', function() {
                goToPage('welcomePage');
            });
            
            // 第二页 -> 开始测试（这里可以跳转到你的问题页面）
            document.getElementById('startQuestions').addEventListener('click', function() {
                // 保存用户数据到本地存储
                localStorage.setItem('nvctUserData', JSON.stringify(userData));
                
                // 输出用户数据到控制台（调试用）
                console.log('用户数据:', userData);
                
                // 这里跳转到你的问题页面
                // goToPage('questionPage1');
                
                // 临时显示成功消息
                alert('信息收集完成！年龄：' + userData.age + 
                      '，性别：' + userData.gender + 
                      '，职业：' + userData.job + 
                      '\n\n现在可以跳转到测试题目页面了。');
            });
        });
    </script>
</body>
</html>
